[package]
name = "md4x"
version = "0.1.1"
edition = "2024"
description = "Convert a Markdown file to a magazine-quality PDF."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = "0.27"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
name = "md4x"
path = "src/lib.rs"

[[bin]]
name = "md4x"
path = "src/main.rs"
