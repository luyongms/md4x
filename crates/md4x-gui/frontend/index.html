<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>md4x</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <span id="filename">Untitled</span>
    <span id="unsaved" hidden aria-label="unsaved changes">•</span>
    <div id="toolbar-right">
      <select id="template-select" aria-label="Template"></select>
      <button id="export-btn">Export PDF</button>
    </div>
  </div>

  <div id="panes">
    <div id="editor-pane">
      <textarea id="editor" spellcheck="false" placeholder="Type Markdown here…"></textarea>
    </div>
    <div id="resizer" role="separator" aria-orientation="vertical"></div>
    <div id="preview-pane">
      <iframe id="preview-a" title="Preview" sandbox="allow-scripts allow-same-origin"></iframe>
      <iframe id="preview-b" title="Preview" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-words">0 words</span>
    <span id="status-lines">0 lines</span>
    <span id="status-state">idle</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
