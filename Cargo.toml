[workspace]
resolver = "2"
members = [
    "crates/md4x-core",
    "crates/md4x-cli",
    "crates/md4x-gui",
]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.27", features = ["syntect"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
include_dir = "0.7"
two-face = "0.5"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
